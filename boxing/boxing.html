<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BoxQuest 3</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none;user-select:none}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =========================================================================
   BoxQuest 3 — first-person boxing (in the spirit of 4D Sports Boxing) with Quest controllers.
   Pixel art with modern light: the scene is drawn small (384x216, x5 = 1080p) with soft shading, then snapped
   to a 32-colour palette (ENDESGA 32) with 4x4 ordered dithering. Bloom, light beams, a crowd with camera
   flashes, hit-stop, slow motion on knockdowns and particles go on top. The HUD uses a 5x7 pixel font.
   Each controller is a glove. Move a glove fast toward the opponent to punch (jab, cross, hook, uppercut),
   keep both gloves up to block, thumbstick to step and side-step.
   TIP: hold each controller with the black ring turned toward the Quest. The cameras see it much better.
   Hold A / X for a second to calibrate (point the controllers at the TV, level, still).
   Test without a Quest: mouse (move = right glove, click = punch), J / K = left / right punch, A D W S = move.
   Keys: Enter fight, C calibrate, F flip forward, M mirror left-right, N next opponent, P pixel filter, G glow, Esc title.
   ?demo=title|fight|wind|hit|down|ko|lose shows a scene without the Quest (for screenshots).
   ========================================================================= */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const DEMO = new URLSearchParams(location.search).get('demo');

// scene 384x216, HUD 960x540 (crisp pixel font), glow 192x108 (blurred for bloom)
const LW = 384, LH = 216, HW = 960, HH = 540, HS = HW / LW, HOR0 = LH * 0.46, FOCAL = LH * 1.15, EYE = 1.7;
const mk = (w, h, o) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d', o)]; };
const [sc, g] = mk(LW, LH, { willReadFrequently: true }), [tl, t2] = mk(LW, LH), [gc, gg] = mk(LW / 2, LH / 2), [bc, bl] = mk(LW / 2, LH / 2), [hc, h2] = mk(HW, HH), [vg, vgc] = mk(192, 108);
{ const gr = vgc.createRadialGradient(96, 54, 40, 96, 54, 112); gr.addColorStop(0, 'rgba(12,10,18,0)'); gr.addColorStop(1, 'rgba(12,10,18,0.6)'); vgc.fillStyle = gr; vgc.fillRect(0, 0, 192, 108); }
let W = 0, H = 0, OUT = { x: 0, y: 0, w: LW, h: LH };
function resize(){ const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = Math.round(W * d); cv.height = Math.round(H * d); ctx.setTransform(d, 0, 0, d, 0, 0);
  const r = Math.min(W / LW, H / LH); OUT = { w: LW * r, h: LH * r, x: (W - LW * r) / 2, y: (H - LH * r) / 2 }; }
addEventListener('resize', resize); resize();

let VY = 0, VH = 0, HOR = HOR0;                                      // camera drop (you got knocked out) and look-down (he is down)
const proj = p => { const z = Math.max(0.06, p[2]); return { x: LW / 2 + p[0] / z * FOCAL, y: HOR - (p[1] + VY) / z * FOCAL, s: FOCAL / z }; };

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const add3 = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], mul3 = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const norm3 = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const lerp3 = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
function qrot(q, v){ const u = [q[0], q[1], q[2]], w = q[3]; const c = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; const t = c(u, v).map(x => x * 2), ct = c(u, t); return [v[0] + t[0]*w + ct[0], v[1] + t[1]*w + ct[1], v[2] + t[2]*w + ct[2]]; }
const dist3 = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]);

// ---------- palette: ENDESGA 32 plus one deeper shadow, snapped with 4x4 ordered dithering ----------
const PAL = 'be4a2f d77643 ead4aa e4a672 b86f50 733e39 3e2731 a22633 e43b44 f77622 feae34 fee761 63c74d 3e8948 265c42 193c3e 124e89 0099db 2ce8f5 ffffff c0cbdc 8b9bb4 5a6988 3a4466 262b44 181425 ff0044 68386c b55088 f6757a e8b796 c28569 0c0a12'
  .split(' ').map(h => [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)));
const LUT = new Uint32Array(32768);
for (let i = 0; i < 32768; i++){ const r = (i >> 10) * 255 / 31, gn = (i >> 5 & 31) * 255 / 31, b = (i & 31) * 255 / 31; let best = 0, bd = 1e12;
  for (let k = 0; k < PAL.length; k++){ const p = PAL[k], m = (r + p[0]) / 2, dr = r - p[0], dg = gn - p[1], db = b - p[2], d = (2 + m / 256) * dr * dr + 4 * dg * dg + (2 + (255 - m) / 256) * db * db; if (d < bd){ bd = d; best = k; } }
  const p = PAL[best]; LUT[i] = (255 << 24 | p[2] << 16 | p[1] << 8 | p[0]) >>> 0; }
let PIX = true, GLOW = true;
const DTH = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(b => Math.round((b / 15 - 0.5) * 28));
function pixelate(shift){                                            // shift > 0: the red channel slides (you got hit)
  const im = g.getImageData(0, 0, LW, LH), d = im.data, u = new Uint32Array(d.buffer);
  for (let y = 0, i = 0; y < LH; y++){ const row = (y & 3) << 2;
    for (let x = 0; x < LW; x++, i++){ const o = DTH[row | x & 3], j = i << 2, jr = shift && x + shift < LW ? j + (shift << 2) : j;
      let r = d[jr] + o, gn = d[j + 1] + o, b = d[j + 2] + o;
      r = r < 0 ? 0 : r > 255 ? 255 : r; gn = gn < 0 ? 0 : gn > 255 ? 255 : gn; b = b < 0 ? 0 : b > 255 ? 255 : b;
      u[i] = LUT[(r >> 3) << 10 | (gn >> 3) << 5 | b >> 3]; } }
  g.putImageData(im, 0, 0); }

// ---------- 5x7 pixel font ----------
const FONT = {};
{ const src = { A: '01110 10001 10001 11111 10001 10001 10001', B: '11110 10001 10001 11110 10001 10001 11110', C: '01110 10001 10000 10000 10000 10001 01110', D: '11110 10001 10001 10001 10001 10001 11110',
    E: '11111 10000 10000 11110 10000 10000 11111', F: '11111 10000 10000 11110 10000 10000 10000', G: '01110 10001 10000 10111 10001 10001 01111', H: '10001 10001 10001 11111 10001 10001 10001',
    I: '01110 00100 00100 00100 00100 00100 01110', J: '00111 00010 00010 00010 00010 10010 01100', K: '10001 10010 10100 11000 10100 10010 10001', L: '10000 10000 10000 10000 10000 10000 11111',
    M: '10001 11011 10101 10101 10001 10001 10001', N: '10001 10001 11001 10101 10011 10001 10001', O: '01110 10001 10001 10001 10001 10001 01110', P: '11110 10001 10001 11110 10000 10000 10000',
    Q: '01110 10001 10001 10001 10101 10010 01101', R: '11110 10001 10001 11110 10100 10010 10001', S: '01111 10000 10000 01110 00001 00001 11110', T: '11111 00100 00100 00100 00100 00100 00100',
    U: '10001 10001 10001 10001 10001 10001 01110', V: '10001 10001 10001 10001 10001 01010 00100', W: '10001 10001 10001 10101 10101 10101 01010', X: '10001 10001 01010 00100 01010 10001 10001',
    Y: '10001 10001 10001 01010 00100 00100 00100', Z: '11111 00001 00010 00100 01000 10000 11111', 0: '01110 10001 10011 10101 11001 10001 01110', 1: '00100 01100 00100 00100 00100 00100 01110',
    2: '01110 10001 00001 00010 00100 01000 11111', 3: '11111 00010 00100 00010 00001 10001 01110', 4: '00010 00110 01010 10010 11111 00010 00010', 5: '11111 10000 11110 00001 00001 10001 01110',
    6: '00110 01000 10000 11110 10001 10001 01110', 7: '11111 00001 00010 00100 01000 01000 01000', 8: '01110 10001 10001 01110 10001 10001 01110', 9: '01110 10001 10001 01111 00001 00010 01100',
    ' ': '00000 00000 00000 00000 00000 00000 00000', '!': '00100 00100 00100 00100 00100 00000 00100', '?': '01110 10001 00001 00010 00100 00000 00100', '.': '00000 00000 00000 00000 00000 01100 01100',
    ',': '00000 00000 00000 00000 01100 00100 01000', ':': '00000 01100 01100 00000 01100 01100 00000', '-': '00000 00000 00000 11111 00000 00000 00000', '+': '00000 00100 00100 11111 00100 00100 00000',
    '/': '00001 00001 00010 00100 01000 10000 10000', '=': '00000 00000 11111 00000 11111 00000 00000', '(': '00010 00100 01000 01000 01000 00100 00010', ')': '01000 00100 00010 00010 00010 00100 01000',
    "'": '00100 00100 01000 00000 00000 00000 00000', '%': '11000 11001 00010 00100 01000 10011 00011', '<': '00010 00100 01000 10000 01000 00100 00010', '>': '01000 00100 00010 00001 00010 00100 01000' };
  for (const ch in src){ const runs = []; src[ch].split(' ').forEach((row, y) => { for (let x = 0; x < 5; x++) if (row[x] === '1'){ let w = 1; while (row[x + w] === '1') w++; runs.push([x, y, w]); x += w - 1; } }); FONT[ch] = runs; } }
function glyphs(c, s, x0, y0, k, col){ const arr = Array.isArray(col); if (!arr) c.fillStyle = col;
  for (let i = 0; i < s.length; i++){ const runs = FONT[s[i]] || FONT['?']; for (const [rx, ry, rw] of runs){ if (arr) c.fillStyle = col[ry]; c.fillRect(x0 + (i * 6 + rx) * k, y0 + ry * k, rw * k, k); } } }
function tbox(s, x, y, k, align){ const w = (s.length * 6 - 1) * k; return [Math.round(align === 'center' ? x - w / 2 : align === 'right' ? x - w : x), Math.round(y - 3.5 * k), w]; }
function ptext(c, s, x, y, k, col, align = 'center', sh = '#181425'){ s = String(s).toUpperCase(); const [x0, y0, w] = tbox(s, x, y, k, align);
  if (sh){ const o = Math.max(1, Math.round(k / 3)); if (k >= 2) for (const [dx, dy] of [[-o, 0], [o, 0], [0, -o], [0, o]]) glyphs(c, s, x0 + dx, y0 + dy, k, sh); glyphs(c, s, x0 + o, y0 + o * (k >= 2 ? 2 : 1), k, sh); }
  glyphs(c, s, x0, y0, k, col); return w; }
const GOLD = ['#ffffff', '#fee761', '#fee761', '#feae34', '#feae34', '#f77622', '#be4a2f'], REDT = ['#f6757a', '#f6757a', '#e43b44', '#e43b44', '#a22633', '#a22633', '#3e2731'], WHITE = ['#ffffff', '#ffffff', '#ffffff', '#c0cbdc', '#c0cbdc', '#8b9bb4', '#8b9bb4'];

// ---------- glow layer (bloom) ----------
function beginGlow(ox, oy){ gg.setTransform(1, 0, 0, 1, 0, 0); gg.globalCompositeOperation = 'source-over'; gg.globalAlpha = 1; gg.clearRect(0, 0, gc.width, gc.height); gg.globalCompositeOperation = 'lighter'; gg.setTransform(0.5, 0, 0, 0.5, ox * 0.5, oy * 0.5); }
function glow(x, y, r, col, a = 1){ if (a < 0.02 || r < 0.5) return; const gr = gg.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)'); gg.globalAlpha = Math.min(1, a); gg.fillStyle = gr; gg.fillRect(x - r, y - r, 2 * r, 2 * r); gg.globalAlpha = 1; }
function textGlow(s, x, y, k, col, a = 0.6){ s = String(s).toUpperCase(); const [x0, y0] = tbox(s, x, y, k, 'center'); gg.save(); gg.setTransform(0.2, 0, 0, 0.2, 0, 0); gg.globalAlpha = a; glyphs(gg, s, x0, y0, k, col); gg.restore(); }
function present(){ ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.imageSmoothingEnabled = false; ctx.drawImage(sc, OUT.x, OUT.y, OUT.w, OUT.h);
  ctx.save(); ctx.imageSmoothingEnabled = true;
  if (GLOW){ bl.globalCompositeOperation = 'source-over'; bl.clearRect(0, 0, bc.width, bc.height); bl.filter = 'blur(2px)'; bl.drawImage(gc, 0, 0); bl.globalCompositeOperation = 'lighter'; bl.filter = 'blur(7px)'; bl.drawImage(gc, 0, 0); bl.filter = 'none';
    ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(bc, OUT.x, OUT.y, OUT.w, OUT.h); ctx.globalAlpha = 0.5; ctx.drawImage(gc, OUT.x, OUT.y, OUT.w, OUT.h); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
  ctx.drawImage(vg, OUT.x, OUT.y, OUT.w, OUT.h); ctx.restore(); }
function presentHUD(){ ctx.imageSmoothingEnabled = false; ctx.drawImage(hc, OUT.x, OUT.y, OUT.w, OUT.h); }

// ---------- sound ----------
const sfx = (() => { let ac = null, master = null, noise = null;
  function init(){ if (!ac){ try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination); const n = ac.sampleRate; noise = ac.createBuffer(1, n, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; } catch { ac = null; } } if (ac && ac.state === 'suspended') ac.resume(); }
  const ok = () => ac && ac.state === 'running';
  function tone(type, f0, f1, dur, vol, delay = 0){ if (!ok()) return; const t = ac.currentTime + delay, o = ac.createOscillator(), gn = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + 0.005); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(gn).connect(master); o.start(t); o.stop(t + dur + 0.03); }
  function crowd(vol = 0.2, dur = 1.2){ if (!ok()) return; const t = ac.currentTime, s = ac.createBufferSource(); s.buffer = noise; const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.6; const gn = ac.createGain();
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + 0.2); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur); s.connect(bp).connect(gn).connect(master); s.start(t); s.stop(t + dur); }
  return { init, ready: ok, crowd, swish: () => tone('sawtooth', 900, 200, 0.1, 0.07), cue: () => tone('square', 1200, 1200, 0.08, 0.08), thud: v => { tone('sine', 160, 40, 0.18, 0.3 * v); tone('square', 220, 70, 0.1, 0.12 * v); },
    block: () => tone('triangle', 500, 250, 0.1, 0.2), hurt: () => { tone('sawtooth', 200, 50, 0.3, 0.25); }, ding: n => tone('triangle', 700 + n * 120, 900 + n * 120, 0.12, 0.15),
    bell: () => [1500, 1500, 1500].forEach((f, i) => tone('triangle', f, f * 0.98, 0.5, 0.2, i * 0.35)), ko: () => [400, 300, 220, 160].forEach((f, i) => tone('square', f, f * 0.9, 0.25, 0.2, i * 0.15)) }; })();
setInterval(() => { if (!sfx.ready()) sfx.init(); }, 1000);
addEventListener('keydown', () => sfx.init()); addEventListener('mousedown', () => sfx.init());

// ---------- hands: Quest controller -> glove ----------
const S = 1.7;                                                   // arm travel is amplified so a short punch reaches the opponent
const REST = { left: [-0.3, -0.24, 0.8], right: [0.3, -0.24, 0.8] };
const HOLD_MS = 900, CAL_MS = 800;
class Hand {
  constructor(name){ this.name = name; this.seen = -1e9; this.p = null; this.t = 0; this.v = [0, 0, 0]; this.home = null; this.fwdDir = null; this.fixed = false; this.cal = null; this.calDone = 0; this.stick = [0, 0]; this.aHeld = false; this.aLong = false;
    this.pos = REST[name].slice(); this.vel = [0, 0, 0]; this.sim = 0; this.trail = []; this.emuSince = 0; this.weak = false; this.btn = {}; this.punchCd = 0; this.sm = null; }
  present(now){ return now - this.seen < 1500 && !!this.p; }
  feed(h, tms, now){
    const t = tms / 1000, dt = this.p ? clamp(t - this.t, 1 / 240, 0.1) : 0.011;
    const v = h.v ? h.v.slice() : (this.p ? [0, 1, 2].map(i => (h.p[i] - this.p[i]) / dt) : [0, 0, 0]); for (let i = 0; i < 3; i++) this.v[i] += 0.55 * (v[i] - this.v[i]);
    this.p = h.p.slice(); this.t = t; this.seen = now; this.stick = h.stick || [0, 0]; this.emu = !!h.emu; this.btn = { a: !!h.a, b: !!h.b, trig: h.trig || 0, grip: h.grip || 0 };
    if (h.emu){ if (!this.emuSince) this.emuSince = now; } else this.emuSince = 0; this.weak = !!this.emuSince && now - this.emuSince > 250;     // the cameras lost the ring: only the motion sensors are guessing
    const pd = h.q ? qrot(h.q, [0, 0, -1]) : null;
    if (!this.home) this.home = this.p.slice(); else if (!this.fixed) for (let i = 0; i < 3; i++) this.home[i] += 0.004 * (this.p[i] - this.home[i]);
    if (this.cal){ const c = this.cal; c.n++; for (let i = 0; i < 3; i++) c.p[i] += h.p[i]; if (pd){ c.d[0] += pd[0]; c.d[2] += pd[2]; }
      if (now - c.t0 > CAL_MS && c.n > 20){ this.home = c.p.map(x => x / c.n); const hh = Math.hypot(c.d[0], c.d[2]); this.fwdDir = hh > 0.3 * c.n ? [c.d[0] / hh, c.d[2] / hh] : null; this.fixed = true; this.cal = null; this.calDone = now; saveCal(); } }
  }
}
const hands = { left: new Hand('left'), right: new Hand('right') };
const CAL_KEY = 'boxquest.cal.v1';
function saveCal(){ try { const c = {}; for (const n of ['left', 'right']) if (hands[n].fixed) c[n] = { home: hands[n].home, dir: hands[n].fwdDir }; localStorage.setItem(CAL_KEY, JSON.stringify(c)); } catch {} }
(function loadCal(){ try { const c = JSON.parse(localStorage.getItem(CAL_KEY) || 'null'); if (c) for (const n of ['left', 'right']) if (c[n] && c[n].home){ hands[n].home = c[n].home; hands[n].fwdDir = c[n].dir || null; hands[n].fixed = true; } } catch {} })();
let FLIP = 1, MIRROR = 1; try { FLIP = JSON.parse(localStorage.getItem('boxquest.flip') || '1'); MIRROR = JSON.parse(localStorage.getItem('boxquest.mirror') || '1'); } catch {}
const startCal = (n, now) => { if (hands[n].present(now) && !hands[n].cal) hands[n].cal = { t0: now, n: 0, p: [0, 0, 0], d: [0, 0, 0] }; };
// forward = the way the controllers pointed at calibration (at the TV); without that, away from the origin
function frame(){
  const dirs = ['left', 'right'].map(n => hands[n].fwdDir).filter(Boolean);
  let f;
  if (dirs.length){ const x = dirs.reduce((s, v) => s + v[0], 0), z = dirs.reduce((s, v) => s + v[1], 0), l = Math.hypot(x, z) || 1; f = [x / l * FLIP, 0, z / l * FLIP]; }
  else { const hs = ['left', 'right'].filter(n => hands[n].home).map(n => hands[n].home); if (!hs.length) return { f: [0, 0, 1], r: [-1, 0, 0] };
    const gx = hs.reduce((s, h) => s + h[0], 0) / hs.length, gz = hs.reduce((s, h) => s + h[2], 0) / hs.length, l = Math.hypot(gx, gz); f = l > 0.3 ? [gx / l * FLIP, 0, gz / l * FLIP] : [0, 0, 1]; }
  return { f, r: [-f[2] * MIRROR, 0, f[0] * MIRROR] };
}
function updateGloves(now, dt){
  const fr = frame();
  for (const n of ['left', 'right']){ const h = hands[n]; let target = null;
    if (h.present(now) && h.home){ const d = [h.p[0] - h.home[0], h.p[1] - h.home[1], h.p[2] - h.home[2]];
      const lat = dot(d, fr.r), fw = dot(d, fr.f), up = d[1], vl = dot(h.v, fr.r), vf = dot(h.v, fr.f), vu = h.v[1];
      target = [REST[n][0] + lat * S, REST[n][1] + up * S, Math.max(0.22, REST[n][2] + fw * S)]; h.vel = [vl * S, vu * S, vf * S]; }
    else if (h.sim > 0){ h.sim -= dt; const k = 1 - h.sim / 0.28, s = Math.sin(clamp(k, 0, 1) * Math.PI); h.vel = [0, 0, k < 0.5 ? 4.5 : -3]; target = [REST[n][0] * (1 - 0.9 * s), REST[n][1] + 0.25 * s, REST[n][2] + s * 0.75]; }
    else { h.vel = [0, 0, 0]; target = REST[n].slice(); if (TEST.mouse && n === 'right' && !hands.right.present(now)) target = [(TEST.mx - 0.5) * 1.2, -(TEST.my - 0.6) * 1.2, 0.8]; }
    // light smoothing (more when the tracking is weak), so the glove does not jitter
    const k = 1 - Math.exp(-dt * (h.weak ? 10 : 34)); h.pos = h.sm ? h.pos.map((p, i) => p + (target[i] - p) * k) : target; h.sm = true;
    h.trail.push([h.pos[0], h.pos[1], h.pos[2]]); if (h.trail.length > 6) h.trail.shift();
  }
}

// ---------- test input (no Quest) ----------
const TEST = { keys: {}, mouse: false, mx: 0.5, my: 0.6 };
addEventListener('mousemove', e => { TEST.mouse = true; TEST.mx = (e.clientX - OUT.x) / OUT.w; TEST.my = (e.clientY - OUT.y) / OUT.h; });
addEventListener('mousedown', e => { if (e.button === 0) hands.right.sim = 0.28; else hands.left.sim = 0.28; sfx.swish(); });
addEventListener('keydown', e => { const k = e.key.toLowerCase(); TEST.keys[k] = true;

  for (let i = 0; i < 3; i++){ const x = HW - 24 - nw - 22 - i * 16, on = i < G.kd; h2.fillStyle = '#181425'; h2.fillRect(x - 1, 51, 12, 12); h2.fillStyle = on ? '#e43b44' : '#3a4466'; h2.fillRect(x, 52, 10, 10); if (on){ h2.fillStyle = '#f6757a'; h2.fillRect(x, 52, 10, 2); } }   // knockdowns
  const left = Math.max(0, Math.ceil(G.ROUND_T - G.roundT)); h2.fillStyle = 'rgba(24,20,37,.85)'; h2.fillRect(HW / 2 - 70, 8, 140, 84); h2.fillStyle = '#3a4466'; h2.fillRect(HW / 2 - 70, 8, 140, 2); h2.fillRect(HW / 2 - 70, 90, 140, 2);
  ptext(h2, `ROUND ${G.round}`, HW / 2, 22, 2, '#fee761'); ptext(h2, String(left).padStart(2, '0'), HW / 2, 51, 5, left <= 10 && blink ? REDT : WHITE); ptext(h2, `SCORE ${G.score}`, HW / 2, 79, 1, '#c0cbdc');
  for (const p of G.popups){ if (p.life < 0.15 && Math.floor(now / 50) % 2) continue; ptext(h2, p.t, p.x * HS, p.y * HS, 0.9 - p.life < 0.07 ? 4 : 3, p.c); }
  if (G.msg){ if (G.msg !== lastMsg){ lastMsg = G.msg; msgAge = 0; } msgAge += rdt; const k = msgScale(G.msg.text) + (msgAge < 0.14 ? Math.round((0.14 - msgAge) / 0.14 * 5) : 0); ptext(h2, G.msg.text, HW / 2, HH * 0.38, k, G.msg.text.includes('LOSE') ? REDT : GOLD); }
  if (OPP.st === 'down') ptext(h2, Math.min(8, Math.floor((3.2 - OPP.downT) / 0.38) + 1), HW / 2, HH * 0.6, 9, WHITE);
  if (G.state === 'over' && G.stateT > 3 && Math.floor(now / 500) % 2 === 0) ptext(h2, 'ENTER / B = AGAIN', HW / 2, HH * 0.56, 3, '#ffffff');
  drawInputs(now, 82);
  ['left', 'right'].forEach((n, i) => { const h = hands[n], y = HH * 0.78 + i * 22; if (h.cal) ptext(h2, `${n}: point at the TV, level - calibrating... hold still`, HW / 2, y, 2, '#fee761'); else if (h.present(now) && !h.fixed) ptext(h2, `${n}: point at the TV, then hold A / X`, HW / 2, y, 2, '#feae34'); });
  if (['left', 'right'].some(n => hands[n].weak)) ptext(h2, 'TURN THE BLACK RING TOWARD THE QUEST', HW / 2, HH * 0.9, 3, '#e43b44');
  else ptext(h2, 'PUNCH = MOVE A GLOVE FAST   GLOVES UP = BLOCK   STICK = STEP / SIDE-STEP   HOLD A / X = CALIBRATE   F = FLIP FORWARD   M = MIRROR', HW / 2, HH - 10, 1, '#8b9bb4');
}

function drawGame(now, rdt){
  const lostKO = G.state === 'over' && !G.win && !G.points, vhT = OPP.st === 'ko' ? 80 : OPP.st === 'down' ? 24 : lostKO ? -36 : 0, vyT = lostKO ? 1.15 : 0;
  VH += (vhT - VH) * (1 - Math.exp(-rdt * 3)); VY += (vyT - VY) * (1 - Math.exp(-rdt * 2.2)); HOR = HOR0 - VH;
  G.hype = Math.max(0.15, G.hype - rdt * 0.12);
  const k = G.shake * 7, sx = Math.round(rand(-1, 1) * k), sy = Math.round(rand(-1, 1) * k);
  beginGlow(sx, sy); g.save(); g.translate(sx, sy);
  drawArena(now, rdt); drawRing(now); drawBeams(now); drawOpp(now); drawFx(); drawPlayer(now);
  g.restore(); drawOverlays(now); hudGlow();
  if (PIX) pixelate(G.hurt > 0 ? Math.round(G.hurt * 9) : 0); present(); drawHUD(now, rdt); presentHUD();
}
let fps = 60;
function drawTitle(now, rdt){
  ackCal(now); updateGloves(now, rdt); OPP.bob += rdt * 3; G.cam.x = Math.sin(now / 3500) * 0.3; G.cam.f = -0.2; VY = 0; VH = 0; HOR = HOR0;      // the gloves move here too: check the tracking before the fight
  for (const p of G.popups){ p.life -= rdt; p.y -= 12 * rdt; } G.popups = G.popups.filter(p => p.life > 0);
  const keep = [OPP.st, OPP.d, OPP.x, OPP.hurtT, G.fighter, G.oflash, G.hype]; Object.assign(OPP, { st: 'guard', d: 1.8, x: 0, hurtT: 0 }); G.fighter = FIGHTERS[FI]; G.oflash = 0; G.hype = 0.3;
  beginGlow(0, 0); drawArena(now, rdt); drawRing(now); drawBeams(now); drawOpp(now); drawPlayer(now);
  [OPP.st, OPP.d, OPP.x, OPP.hurtT, G.fighter, G.oflash, G.hype] = keep;
  const dk = g.createLinearGradient(0, 0, 0, LH); dk.addColorStop(0, 'rgba(12,10,18,.75)'); dk.addColorStop(0.45, 'rgba(12,10,18,.2)'); dk.addColorStop(1, 'rgba(12,10,18,.85)'); g.fillStyle = dk; g.fillRect(0, 0, LW, LH);
  textGlow('BOXQUEST', HW / 2, 92, 11, 'rgb(255,140,40)', 0.7);
  if (PIX) pixelate(0); present();
  h2.clearRect(0, 0, HW, HH); const F = FIGHTERS[FI];
  ptext(h2, 'BOXQUEST', HW / 2, 92, 11, GOLD); ptext(h2, 'FIRST-PERSON BOXING WITH QUEST CONTROLLERS', HW / 2, 150, 2, '#c0cbdc');
  ptext(h2, `TONIGHT: ${F.name}`, HW / 2, 186, 3, '#fee761');
  ptext(h2, questCount ? `QUEST CONNECTED   ${poseHz.toFixed(0)} POSES/S` : 'NO QUEST - OPEN THE TRACKER PAGE', HW / 2, 236, 2, questCount ? '#63c74d' : '#e43b44');
  ['left', 'right'].forEach((n, i) => { const h = hands[n], on = h.present(now); ptext(h2, `${n} glove: ${on ? (h.fixed ? 'ready' : 'point at the TV, hold A / X') : 'not seen'}`, HW / 2, 264 + i * 22, 2, on ? (h.fixed ? '#63c74d' : '#feae34') : '#e43b44'); });
  if (Math.floor(now / 500) % 2 === 0) ptext(h2, 'ENTER / B = FIGHT', HW / 2, 350, 5, GOLD);
  h2.fillStyle = 'rgba(24,20,37,.82)'; h2.fillRect(50, 396, HW - 100, 86); h2.fillStyle = '#3a4466'; h2.fillRect(50, 396, HW - 100, 2); h2.fillRect(50, 480, HW - 100, 2);
  ptext(h2, 'TIP: TURN THE BLACK RING OF EACH CONTROLLER TOWARD THE QUEST', HW / 2, 414, 2, '#feae34');
  ptext(h2, 'PUNCH = MOVE A GLOVE FAST AT HIM.  GLOVES UP = BLOCK.  STICK = STEP', HW / 2, 440, 2, '#ffffff');
  ptext(h2, 'A YELLOW FLASH SHOWS WHERE HIS PUNCH COMES FROM.  3 KNOCKDOWNS = K.O.', HW / 2, 466, 2, '#ffffff');
  ptext(h2, 'C CALIBRATE   F FLIP   M MIRROR   N NEXT OPPONENT   P PIXEL FILTER   G GLOW', HW / 2, 516, 1, '#8b9bb4'); ptext(h2, `${Math.round(fps)} FPS`, HW - 8, HH - 8, 1, '#5a6988', 'right');
  for (const p of G.popups) ptext(h2, p.t, p.x * HS, p.y * HS, 3, p.c);
  drawInputs(now, 18); presentHUD();
}

// ---------- loop: hit-stop and slow motion bend the game clock ----------
let last = performance.now();
function loop(now){ const rdt = Math.min(0.05, (now - last) / 1000); last = now; fps += (1 / Math.max(rdt, 1e-3) - fps) * 0.05;
  if (mode === 'fight'){ let dt = rdt; if (G.stop > 0){ G.stop -= rdt; dt = rdt * 0.06; } else if (G.slow > 0){ G.slow -= rdt; dt = rdt * 0.35; } updateGame(dt, now); drawGame(now, rdt); }
  else drawTitle(now, rdt);
  requestAnimationFrame(loop); }
requestAnimationFrame(loop);
if (DEMO) setTimeout(() => { if (DEMO === 'title') return; startFight(); G.state = 'fight'; G.msg = null;
  if (DEMO === 'down'){ G.ohp = 0; knockdown(); } else if (DEMO === 'ko'){ G.kd = 2; knockdown(); } else if (DEMO === 'lose'){ G.hp = 0; endFight(false); }
  else if (DEMO === 'wind') startPunch('hook', 1, 0); else if (DEMO === 'hit') hands.right.sim = 0.28; }, 400);
</script>
