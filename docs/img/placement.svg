<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="ui-rounded, 'Trebuchet MS', Verdana, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#444"/></marker>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fc3ff"/><stop offset="1" stop-color="#b9e8ff"/></linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd84d" stop-opacity=".55"/><stop offset="1" stop-color="#ffd84d" stop-opacity=".05"/></linearGradient>
  </defs>

  <!-- room -->
  <rect width="960" height="540" fill="#fff7ec"/>
  <rect y="430" width="960" height="110" fill="#f0d9b5"/>
  <rect y="426" width="960" height="8" fill="#e2c391"/>

  <!-- camera cone from the Quest to the players -->
  <polygon points="262,372 880,215 880,470" fill="url(#cone)"/>

  <!-- TV on a low table -->
  <rect x="50" y="80" width="330" height="205" rx="14" fill="#2b2b3a"/>
  <rect x="64" y="94" width="302" height="177" rx="6" fill="url(#sky)"/>
  <rect x="64" y="236" width="302" height="35" fill="#46b34a"/>
  <rect x="64" y="231" width="302" height="7" fill="#2f8f34"/>
  <circle cx="120" cy="118" r="0"/>
  <!-- tiny pixel duck on the screen -->
  <g transform="translate(250,150)">
    <rect x="0" y="6" width="30" height="12" fill="#222"/><rect x="24" y="0" width="12" height="10" fill="#1faa48"/><rect x="36" y="3" width="8" height="4" fill="#ff9a1f"/><rect x="6" y="-2" width="12" height="8" fill="#888"/>
  </g>
  <!-- crosshairs on the TV (where the controllers aim) -->
  <g fill="none" stroke-width="4">
    <g stroke="#2a8cff"><rect x="150" y="140" width="34" height="34" rx="3"/><path d="M167 132v10M167 172v10M142 157h10M182 157h10"/></g>
    <g stroke="#ff9a1f"><rect x="270" y="170" width="34" height="34" rx="3"/><path d="M287 162v10M287 202v10M262 187h10M302 187h10"/></g>
  </g>
  <rect x="190" y="285" width="50" height="22" fill="#2b2b3a"/>
  <rect x="30" y="305" width="370" height="16" rx="6" fill="#a8743a"/>
  <rect x="50" y="321" width="14" height="108" fill="#8a5d2b"/><rect x="366" y="321" width="14" height="108" fill="#8a5d2b"/>

  <!-- the Quest, sitting on the table under the TV (cartoon) -->
  <g transform="translate(160,326)">
    <rect x="0" y="0" width="112" height="58" rx="18" fill="#f2f4f8" stroke="#333" stroke-width="3"/>
    <rect x="8" y="10" width="96" height="30" rx="12" fill="#d8dde6" stroke="#333" stroke-width="2"/>
    <circle cx="30" cy="25" r="9" fill="#1d2330"/><circle cx="56" cy="25" r="9" fill="#1d2330"/><circle cx="82" cy="25" r="9" fill="#1d2330"/>
    <circle cx="30" cy="25" r="3" fill="#6fe3ff"/><circle cx="56" cy="25" r="3" fill="#6fe3ff"/><circle cx="82" cy="25" r="3" fill="#6fe3ff"/>
    <!-- eyes -->
    <circle cx="40" cy="48" r="4" fill="#222"/><circle cx="72" cy="48" r="4" fill="#222"/>
  </g>
  <text x="216" y="408" text-anchor="middle" font-size="17" font-weight="700" fill="#333">Quest 3</text>

  <path d="M424 250 L168 160" fill="none" stroke="#2a8cff" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/>
  <path d="M624 290 L292 188" fill="none" stroke="#ff9a1f" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/>
  <!-- player 1 -->
  <g transform="translate(560,0)">
    <ellipse cx="0" cy="436" rx="46" ry="9" fill="#00000022"/>
    <rect x="-26" y="282" width="52" height="100" rx="22" fill="#2a8cff"/>
    <rect x="-26" y="372" width="21" height="62" rx="9" fill="#3a3f55"/><rect x="5" y="372" width="21" height="62" rx="9" fill="#3a3f55"/>
    <circle cx="0" cy="256" r="32" fill="#ffd2a8" stroke="#333" stroke-width="3"/>
    <path d="M-30 248Q-22 214 0 218Q22 214 30 248Q18 232 0 234Q-18 232 -30 248Z" fill="#8a4b1f"/>
    <circle cx="-11" cy="258" r="4" fill="#222"/><circle cx="11" cy="258" r="4" fill="#222"/>
    <path d="M-10 272Q0 282 10 272" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/>
    <!-- arm + controller pointing at the TV -->
    <path d="M-20 300Q-70 292 -108 268" fill="none" stroke="#ffd2a8" stroke-width="16" stroke-linecap="round"/>
    <g transform="translate(-122,262) rotate(-24)"><rect x="-22" y="-9" width="44" height="18" rx="9" fill="#f2f4f8" stroke="#333" stroke-width="3"/><circle cx="-26" cy="0" r="12" fill="none" stroke="#2a8cff" stroke-width="5"/></g>
  </g>

  <!-- player 2 (smaller) -->
  <g transform="translate(760,0)">
    <ellipse cx="0" cy="436" rx="40" ry="8" fill="#00000022"/>
    <rect x="-22" y="312" width="44" height="76" rx="20" fill="#ff9a1f"/>
    <rect x="-22" y="378" width="18" height="56" rx="8" fill="#3a3f55"/><rect x="4" y="378" width="18" height="56" rx="8" fill="#3a3f55"/>
    <circle cx="0" cy="288" r="28" fill="#ffd2a8" stroke="#333" stroke-width="3"/>
    <path d="M-27 280Q-20 250 0 252Q20 250 27 280Q16 266 0 268Q-16 266 -27 280Z" fill="#f5c542"/>
    <path d="M-27 280Q-33 306 -22 318" fill="none" stroke="#f5c542" stroke-width="9" stroke-linecap="round"/>
    <circle cx="-10" cy="290" r="3.5" fill="#222"/><circle cx="10" cy="290" r="3.5" fill="#222"/>
    <path d="M-9 302Q0 311 9 302" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/>
    <path d="M-16 330Q-64 322 -96 298" fill="none" stroke="#ffd2a8" stroke-width="14" stroke-linecap="round"/>
    <g transform="translate(-108,292) rotate(-22)"><rect x="-20" y="-8" width="40" height="16" rx="8" fill="#f2f4f8" stroke="#333" stroke-width="3"/><circle cx="-24" cy="0" r="11" fill="none" stroke="#ff9a1f" stroke-width="5"/></g>
  </g>

  <!-- labels -->
  <g fill="#333" font-size="18" font-weight="700">
    <text x="480" y="52" text-anchor="middle" font-size="24">Quest on the shelf, controllers in the players' hands</text>
    <text x="470" y="178" text-anchor="middle" font-size="16" fill="#8a6a00">cameras see the controllers</text>
    <text x="470" y="198" text-anchor="middle" font-size="14" fill="#8a6a00" font-weight="600">(that is all the Quest does)</text>
  </g>
  <g stroke="#444" stroke-width="2" fill="none">
    <path d="M262 480 H736" marker-start="url(#ar)" marker-end="url(#ar)"/>
  </g>
  <text x="500" y="506" text-anchor="middle" font-size="17" font-weight="700" fill="#444">about 1.5 to 2.5 m</text>
  <text x="480" y="30" text-anchor="middle" font-size="0">placement</text>
</svg>
