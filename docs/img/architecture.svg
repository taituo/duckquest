<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="ui-monospace, Menlo, Consolas, monospace">
  <rect width="960" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#333"/></marker>
  </defs>
  <g stroke="#222" stroke-width="2" fill="none">
    <rect x="30" y="40" width="250" height="150" rx="10" fill="#e8f1ff"/>
    <rect x="355" y="40" width="250" height="150" rx="10" fill="#fff4d6"/>
    <rect x="680" y="40" width="250" height="150" rx="10" fill="#e6f7e6"/>
    <rect x="680" y="240" width="250" height="120" rx="10" fill="#f3e6f7"/>
    <path d="M280 115 H355" marker-end="url(#a)"/>
    <path d="M605 115 H680" marker-end="url(#a)"/>
    <path d="M805 240 V190" marker-end="url(#a)"/>
    <path d="M730 300 H520 Q480 300 480 270 V190" stroke-dasharray="6 5" marker-end="url(#a)"/>
  </g>
  <g fill="#111" font-size="15">
    <text x="155" y="68" text-anchor="middle" font-weight="bold" font-size="17">Meta Quest 3</text>
    <text x="155" y="96" text-anchor="middle">sits still, facing the players</text>
    <text x="155" y="118" text-anchor="middle">quest.html (WebXR)</text>
    <text x="155" y="140" text-anchor="middle">controller poses ~90 Hz</text>
    <text x="155" y="162" text-anchor="middle">trigger, grip, A/B buttons</text>

    <text x="480" y="68" text-anchor="middle" font-weight="bold" font-size="17">server.py</text>
    <text x="480" y="96" text-anchor="middle">Python stdlib only</text>
    <text x="480" y="118" text-anchor="middle">HTTP(S) + WebSocket relay</text>
    <text x="480" y="140" text-anchor="middle">runs on a Mac, PC or the Deck</text>
    <text x="480" y="162" text-anchor="middle">saves the calibration</text>

    <text x="805" y="68" text-anchor="middle" font-weight="bold" font-size="17">game.html on the TV</text>
    <text x="805" y="96" text-anchor="middle">canvas, no build step</text>
    <text x="805" y="118" text-anchor="middle">aim = ray -> screen plane</text>
    <text x="805" y="140" text-anchor="middle">per-controller calibration</text>
    <text x="805" y="162" text-anchor="middle">ducks, bear, princess party</text>

    <text x="805" y="268" text-anchor="middle" font-weight="bold" font-size="17">padbridge.py (Deck)</text>
    <text x="805" y="294" text-anchor="middle">reads /dev/input/js0</text>
    <text x="805" y="316" text-anchor="middle">sticks, D-pad, buttons</text>
    <text x="805" y="338" text-anchor="middle">works without the browser gamepad API</text>

    <text x="318" y="105" text-anchor="middle" font-size="13">Wi-Fi</text>
    <text x="643" y="105" text-anchor="middle" font-size="13">WebSocket</text>
    <text x="640" y="320" text-anchor="middle" font-size="13">pad messages</text>
    <text x="480" y="385" text-anchor="middle" font-size="13" fill="#444">Players point the Quest controllers at the TV; the Quest only watches them.</text>
  </g>
</svg>
